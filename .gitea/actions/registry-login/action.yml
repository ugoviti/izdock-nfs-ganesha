name: registry login
description: Setup buildx and log in to the private Gitea registry and, optionally, Docker Hub. Single place where the private image path is built.

inputs:
  registry-host:
    description: Gitea registry host or URL (vars.PACKAGES_HOST || github.server_url); scheme and path are dropped
    required: true
  registry-repository:
    description: Image path inside the private registry (owner/name)
    default: initzero/nfs-ganesha
  registry-username:
    required: true
  registry-token:
    required: true
  dockerhub-username:
    description: Leave empty to skip the Docker Hub login
    default: ''
  dockerhub-password:
    default: ''

outputs:
  image:
    description: Full private image path (host/repository)
    value: ${{ steps.reg.outputs.image }}

runs:
  using: composite
  steps:
    - name: resolve image
      id: reg
      shell: bash
      env:
        REGISTRY_INPUT: ${{ inputs.registry-host }}
        REGISTRY_REPOSITORY: ${{ inputs.registry-repository }}
      run: |
        set -eu
        # an empty host would make docker/login-action fall back to Docker Hub with the Gitea credentials
        # github.server_url is a URL (https://git.example.com): keep only the host
        REGISTRY_HOST=${REGISTRY_INPUT#*://}
        REGISTRY_HOST=${REGISTRY_HOST%%/*}
        if [ -z "$REGISTRY_HOST" ]; then
          echo "::error::the registry host is empty (vars.PACKAGES_HOST or github.server_url), eg. git.example.com"
          exit 1
        fi
        echo "registry ${REGISTRY_HOST}"
        echo "host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"
        echo "image=${REGISTRY_HOST}/${REGISTRY_REPOSITORY}" >> "$GITHUB_OUTPUT"

    - name: setup buildx
      uses: docker/setup-buildx-action@v3

    - name: login private registry
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.reg.outputs.host }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: login docker hub
      if: inputs.dockerhub-username != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
